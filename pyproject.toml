[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge"
dynamic = ["version"]
description = "DLite speculative decoding training and evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.9.1",
    "transformers==4.57.1",
    "numpy",
    "packaging",
    "safetensors",
    "tqdm",
    "typing-extensions",
]

[project.optional-dependencies]
train = [
    "accelerate",
    "datasets",
    "ninja",
    "openai-harmony",
    "psutil",
    "pydantic",
    "qwen-vl-utils==0.0.11",
    "sglang==0.5.9",
    "wandb",
    "yunchang",
]
benchmark = [
    "datasets",
    "huggingface-hub",
    "loguru",
    "rich",
]
dev = [
    "pre-commit",
]
fa = ["flash-attn"]

[tool.setuptools.packages.find]
include = ["specforge*"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}
