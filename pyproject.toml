[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge"
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pre-commit",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.57.1",
    "causal-conv1d==1.7.0",
    "flash-linear-attention[conv1d]==0.5.2",
    "qwen-vl-utils==0.0.11",
    "datasets",
    "setuptools",
    "tqdm",
    "wandb",
    "psutil",
    "numpy",
    "accelerate",
    "pydantic",
    "sglang==0.5.9",
    "openai-harmony",
    "ninja",
    "packaging",
    "yunchang",
]

[tool.setuptools]
packages = ["specforge"]

[project.optional-dependencies]
dev = [
    "pre-commit",
]
fa = ["flash-attn"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}
description = {file = "README.md"}

[tool.uv]
preview = true

[tool.uv.extra-build-dependencies]
# This CUDA extension must use the exact PyTorch C++ ABI selected by the lock.
causal-conv1d = [{ requirement = "torch", match-runtime = true }]
